V.s=i=>{const g=G[i];return`<h2>${en(g.title)}</h2><div class="row">${bar(sysProg(i))}<span>${sysProg(i)}%</span></div><p><small>${E(SYS_AR[i]||"")}</small></p>`+g.sections.map((s,j)=>{const o=secOpen(i,j),d=S.done[secId(i,j)],n=qBySec(secId(i,j)).length;return`<div class="item ${o?"":"lock"}" onclick="${o?`go('/sec/${i}/${j}')`:`alert('أكمل الفصل السابق (وقراءة الدرس واجتياز المستوى الأول إن وُجد) أو عطّل القيود من الإعدادات')`}"><div class="sp"><b>${j+1}. ${en(s.t)}</b><br><small>${n?n+" سؤال":"لا توجد أسئلة بعد"}</small></div><span>${!o?"🔒":d?"✓":""}</span></div>`}).join("")+`<button class="btn s" onclick="startQuiz({mode:'sys',i:${i}})">اختبار نهاية الجهاز</button>`};
V.sec=(i,j)=>{const s=G[i].sections[j],id=secId(i,j);S.last={i,j};save();const f=S.fav["L"+id];
return`<h2>${en(s.t)}</h2><p class="row"><span class="pill">${E(SYS_AR[i]||"")}</span><button class="btn s" onclick="tog('L${id}')">${f?"★ في المفضلة":"☆ أضف للمفضلة"}</button></p>
<div class="card les">${E(s.x)}</div>
<div class="card"><b>المستويات</b>${[1,2,3].map(l=>{const n=qBySec(id,l).length,o=lvOpen(id,l),k=S.quiz[id+"|"+l]||{};return`<div class="item ${o?"":"lock"}"><div class="sp">${LV[l]}<br><small>${n} سؤال${k.attempts?` · محاولات ${k.attempts} · أفضل ${k.best}%${k.passed?" ✓":""}`:""}</small></div><button class="btn" ${n&&o?"":"disabled"} onclick="startQuiz({mode:'lv',s:'${id}',l:${l}})">${o?"ابدأ":"🔒"}</button></div>`}).join("")}</div>
<div class="card"><b>ملاحظاتي</b><textarea rows="3" id="nt" oninput="S.notes['${id}']=this.value;save()">${E(S.notes[id]||"")}</textarea></div>
<div class="card"><b>المرجع</b><p>${E(ref(id))}</p></div>
<div class="row"><button class="btn" onclick="S.done['${id}']=1;save();go('/s/${i}')">${S.done[id]?"✓ أنهيت الدرس":"أنهيت الدرس"}</button></div>`};
const tog=k=>{S.fav[k]?delete S.fav[k]:S.fav[k]=1;save();route()};
// quiz engine
let Q=null;
function startQuiz(o){let qs=[],title="";
if(o.mode==="lv"){qs=qBySec(o.s,o.l);title=LV[o.l]}
else if(o.mode==="sys"){qs=allQ().filter(q=>q.s.startsWith(o.i+"."));title="اختبار "+G[o.i].title}
else if(o.mode==="cum"){qs=shuf(allQ()).slice(0,10);title="اختبار تراكمي عشوائي"}
else if(o.mode==="wrong"){qs=allQ().filter(q=>S.wrong[q.id]);title="مراجعة الأخطاء"}
else if(o.mode==="case"){qs=allC().filter(c=>c.id===o.id);title="حالة سريرية"}
if(!qs.length){alert("لا توجد أسئلة متاحة بعد لهذا القسم. يمكنك إضافة حزمة أسئلة من الإعدادات.");return}
Q={o,title,qs:shuf(qs),i:0,ans:[],pick:null,hint:false};go("/quiz")}
V.quiz=()=>{if(!Q)return V.home();if(Q.i>=Q.qs.length)return finish();const q=Q.qs[Q.i],c=q.c;
return`<div class="row"><b>${E(Q.title)}</b><span class="sp"></span><span class="pill">${Q.i+1}/${Q.qs.length}</span></div>${bar(pct(Q.i,Q.qs.length))}
<div class="card" dir="ltr" style="text-align:left;margin-top:10px">${c?`<p class="warn" dir="rtl" style="text-align:right">حالة تعليمية افتراضية. العمر: ${E(c.age)} · ${E(c.sex)}</p><p><b>Chief complaint:</b> ${E(c.cc)}<br><b>History:</b> ${E(c.hx)}<br><b>Comorbidities:</b> ${E(c.cm)}<br><b>Current drugs:</b> ${E(c.drugs)}<br><b>Labs:</b> ${E(c.labs)}</p>`:""}<span class="pill">${LV[q.l]}</span><h3>${E(q.q)}</h3>
${q.o.map((t,k)=>`<button class="opt ${Q.pick!==null?(k===q.a?"ok":k===Q.pick?"bad":""):""}" ${Q.pick!==null?"disabled":""} onclick="pick(${k})">${E(t)}${Q.pick!==null?`<span class="why">${E(q.w[k]||"")}</span>`:""}</button>`).join("")}
${Q.pick===null?`<button class="btn s" onclick="Q.hint=true;route()">💡 تلميح</button>${Q.hint?`<p class="warn" dir="rtl">${E(q.h||"راجع الدرس")}</p>`:""}`:`<p dir="rtl"><b>${Q.pick===q.a?"✓ صحيحة":"✗ غير صحيحة"}</b> — المرجع: ${E(ref(q.s))}</p><div class="row" dir="rtl"><button class="btn s" onclick="tog('Q${q.id}')">${S.fav["Q"+q.id]?"★":"☆"} مفضلة</button><span class="sp"></span><button class="btn" onclick="Q.i++;Q.pick=null;Q.hint=false;route()">التالي</button></div>`}</div>`};
function pick(k){const q=Q.qs[Q.i];Q.pick=k;Q.ans.push(k===q.a);if(k===q.a){delete S.wrong[q.id];if(q.c)S.caseDone[q.id]=1}else S.wrong[q.id]={n:((S.wrong[q.id]||{}).n||0)+1,t:Date.now()};
const cd=S.cards[q.id]||{b:0};cd.b=k===q.a?Math.min(cd.b+1,4):0;cd.d=Date.now()+(S.set.iv.split(",").map(Number)[cd.b]||1)*864e5;S.cards[q.id]=cd;save();route()}
function finish(){if(Q.html)return Q.html;const ok=Q.ans.filter(Boolean).length,p=pct(ok,Q.ans.length),o=Q.o;let msg="";
S.hist.push({t:Date.now(),title:Q.title,p,n:Q.ans.length});
if(o.mode==="lv"){const k=S.quiz[o.s+"|"+o.l]||{attempts:0,best:0};k.attempts++;k.best=Math.max(k.best,p);if(p>=S.set.pass)k.passed=true;S.quiz[o.s+"|"+o.l]=k;msg=p>=S.set.pass?"✓ اجتزت المستوى وفُتح التالي":"لم تبلغ نسبة النجاح ("+S.set.pass+"%). لم تفقد شيئاً، أعد المحاولة متى شئت."}
save();const[a,b]=o.mode==="lv"?o.s.split("."):[0,0];Q.done=1;
return Q.html=`<div class="card"><h2>النتيجة: ${p}%</h2><p>${ok} من ${Q.ans.length}</p><p>${msg}</p><div class="row"><button class="btn" onclick="startQuiz(Q.o)">إعادة</button><button class="btn s" onclick="go('/review')">مراجعة الأخطاء</button><button class="btn s" onclick="history.go(-2)">رجوع</button></div></div>`}
V.cases=()=>`<h2>الحالات السريرية</h2><p class="warn">حالات افتراضية لأغراض التعلم، ولا تحتوي بيانات مرضى حقيقيين.</p>`+allC().map(c=>`<div class="item" onclick="startQuiz({mode:'case',id:'${c.id}'})"><div class="sp"><b>${en(c.c.cc)}</b><br><small>${E(G[+c.s.split(".")[0]].title)} · ${LV[c.l]}</small><br><small>${E(c.skills||"")}</small></div><span>${S.caseDone[c.id]?"✓":""}</span></div>`).join("");
V.review=()=>{const w=allQ().filter(q=>S.wrong[q.id]),due=allQ().filter(q=>S.cards[q.id]&&S.cards[q.id].d<=Date.now());
return`<h2>Smart Review</h2><p><small>نظام مراجعة محلي بقواعد واضحة (بدون ذكاء اصطناعي).</small></p>
<div class="card"><b>الأخطاء السابقة: ${w.length}</b><br><button class="btn" ${w.length?"":"disabled"} onclick="startQuiz({mode:'wrong'})">إعادة حل الأخطاء</button></div>
<div class="card"><b>بطاقات مستحقة اليوم: ${due.length}</b><br><button class="btn" ${due.length?"":"disabled"} onclick="go('/cards')">ابدأ البطاقات</button></div>
<div class="card"><b>اختبار تراكمي عشوائي</b><br><button class="btn s" onclick="startQuiz({mode:'cum'})">ابدأ (10 أسئلة)</button></div>`};
let CI=0,CF=false;
V.cards=()=>{const d=allQ().filter(q=>S.cards[q.id]&&S.cards[q.id].d<=Date.now());if(!d.length)return"<div class='card'>لا بطاقات مستحقة.</div>";const q=d[CI%d.length];
return`<div class="card" dir="ltr" style="text-align:left"><span class="pill">Flashcard ${d.length} due</span><h3>${E(q.q)}</h3>${CF?`<p><b>${E(q.o[q.a])}</b></p><p dir="rtl"><button class="btn" onclick="rate('${q.id}',1)">عرفتها</button> <button class="btn d" onclick="rate('${q.id}',0)">لم أعرفها</button></p>`:`<button class="btn" onclick="CF=true;route()">أظهر الإجابة</button>`}</div>`};
function rate(id,ok){const c=S.cards[id];c.b=ok?Math.min(c.b+1,4):0;c.d=Date.now()+(S.set.iv.split(",").map(Number)[c.b]||1)*864e5;if(!ok)S.wrong[id]={n:1,t:Date.now()};save();CF=false;route()}
V.fav=()=>{const ks=Object.keys(S.fav);return`<h2>المفضلة</h2>`+(ks.length?ks.map(k=>{if(k[0]==="L"){const[i,j]=k.slice(1).split(".").map(Number);return`<div class="item" onclick="go('/sec/${i}/${j}')">${en(G[i].sections[j].t)}</div>`}const q=allQ().concat(allC()).find(x=>x.id===k.slice(1));return q?`<div class="item" onclick="startQuiz({mode:'${q.c?"case":"lv"}',id:'${q.id}',s:'${q.s}',l:${q.l}})">${en(q.q)}</div>`:""}).join(""):"<p>لا عناصر بعد.</p>")};
V.stats=()=>{const h=S.hist,avg=h.length?Math.round(h.reduce((a,x)=>a+x.p,0)/h.length):0;const wk={};allQ().forEach(q=>{if(S.wrong[q.id]){const t=G[+q.s.split(".")[0]].title;wk[t]=(wk[t]||0)+1}});
return`<h2>الإحصاءات</h2><div class="card">التقدم الكلي: ${totProg()}%<br>اختبارات منجزة: ${h.length} · المتوسط: ${avg}%<br>حالات محلولة: ${Object.keys(S.caseDone).length}/${allC().length}</div><div class="card"><b>مواضيع تحتاج مراجعة</b>${Object.keys(wk).length?Object.entries(wk).map(([k,v])=>`<p>${en(k)}: ${v}</p>`).join(""):"<p>لا شيء حالياً</p>"}</div><div class="card"><b>آخر النتائج</b>${h.slice(-8).reverse().map(x=>`<p>${E(x.title)} — ${x.p}% (${new Date(x.t).toLocaleDateString("ar")})</p>`).join("")||"—"}</div>`};
V.src=()=>`<h2>المصادر العلمية</h2><div class="card"><p>المصدر الأساسي لمحتوى الدروس: <b dir="ltr">${E(SRC)}</b> — مادة تعليمية جامعية.</p><p>كل درس يعرض قسمه ومرجعه داخل الملف. أرقام المراجع المدرجة في النص تشير إلى قوائم المراجع في نهاية كل فصل في ملف PDF؛ لم تُضف روابط أو DOI خارجية لأنه لم يتم التحقق منها.</p><p class="warn">لا يوجد اتصال بقواعد بيانات خارجية. المحتوى المعروض هو ما أُدرج في التطبيق فقط.</p></div>`;
V.more=()=>`<h2>المزيد</h2><div class="grid"><button class="tile" onclick="go('/fav')"><b>★</b>المفضلة</button><button class="tile" onclick="go('/stats')"><b>▤</b>الإحصاءات</button><button class="tile" onclick="go('/src')"><b>§</b>المصادر</button><button class="tile" onclick="go('/search')"><b>⌕</b>بحث</button><button class="tile" onclick="go('/set')"><b>⚙</b>الإعدادات</button></div>`;
let SQ="";
V.search=()=>`<input id="sq" placeholder="ابحث: دواء، مجموعة، أثر جانبي..." value="${E(SQ)}" oninput="SQ=this.value;doSearch()" autofocus><div id="sr"></div>`;
function doSearch(){const t=SQ.trim().toLowerCase(),r=$("#sr");if(t.length<2){r.innerHTML="";return}let h=[];
G.forEach((g,i)=>g.sections.forEach((s,j)=>{const x=s.x.toLowerCase(),p=x.indexOf(t);if(s.t.toLowerCase().includes(t)||p>-1)h.push(`<div class="item" onclick="go('/sec/${i}/${j}')"><div>${en(s.t)}<br><small>${en(g.title)}${p>-1?" — …"+E(s.x.slice(Math.max(0,p-40),p+90).replace(/\n/g," "))+"…":""}</small></div></div>`)}));
allQ().concat(allC()).forEach(q=>{if((q.q+q.o.join(" ")+q.w.join(" ")).toLowerCase().includes(t))h.push(`<div class="item" onclick="startQuiz({mode:'${q.c?"case":"lv"}',id:'${q.id}',s:'${q.s}',l:${q.l}})"><div>${q.c?"حالة":"سؤال"}: ${en(q.q)}<br><small>${E(ref(q.s).slice(0,90))}…</small></div></div>`)});
r.innerHTML=h.length?h.slice(0,40).join(""):"لا نتائج في محتوى التطبيق."}
V.set=()=>{const s=S.set;return`<h2>الإعدادات</h2><div class="card"><label>نسبة النجاح %<input type="number" min="10" max="100" value="${s.pass}" onchange="S.set.pass=+this.value;save()"></label><br><label>الوضع<select onchange="S.set.theme=this.value;save();theme()"><option value="auto" ${s.theme=="auto"?"selected":""}>تلقائي</option><option value="light" ${s.theme=="light"?"selected":""}>فاتح</option><option value="dark" ${s.theme=="dark"?"selected":""}>داكن</option></select></label><br><label>فواصل التكرار المتباعد (أيام)<input value="${E(s.iv)}" onchange="S.set.iv=this.value;save()"></label><br><label class="row"><input type="checkbox" style="width:auto" ${s.locks?"":"checked"} onchange="S.set.locks=!this.checked;save()"> تعطيل القيود وفتح كل الفصول للمراجعة</label></div>
<div class="card"><button class="btn s" onclick="exp()">تصدير التقدم</button> <button class="btn s" onclick="$('#imp').click()">استيراد (تقدم أو حزمة محتوى)</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"><p><small>حزمة المحتوى: ملف JSON بصيغة {"questions":[...],"cases":[...]} بنفس بنية الأسئلة، لإضافة محتوى دون إعادة بناء التطبيق.</small></p></div>
<div class="card"><button class="btn d" onclick="if(confirm('حذف كل التقدم؟')){S=JSON.parse(JSON.stringify(DEF));save(1);go('/home')}">إعادة ضبط التقدم</button></div>`};
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="saydalati-progress.json";a.click()}
function imp(f){if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d.questions||d.cases){S.packs.q=S.packs.q.concat(d.questions||[]);S.packs.c=S.packs.c.concat(d.cases||[])}else if(d.done&&d.set)S=Object.assign(S,d);else throw 0;save(1);alert("تم الاستيراد");route()}catch(e){alert("ملف غير صالح")}})}
// ---- Router
function route(){const h=(location.hash||"#/home").slice(2).split("/"),k=h[0]||"home",a=h.slice(1).map(Number);
$("#app").innerHTML=(V[k]||V.home)(...a);$("#ttl").textContent=k==="home"?"صيدليتي":({sys:"الأجهزة",s:G[a[0]]?G[a[0]].title:"",sec:"درس",quiz:"اختبار",cases:"الحالات",review:"المراجعة",set:"الإعدادات"})[k]||"صيدليتي";
document.querySelectorAll("nav a").forEach((n,i)=>n.classList.toggle("on",["home","sys","review","cases","more"][i]===k));if(k!=="quiz")scrollTo(0,0)}
addEventListener("hashchange",route);
idb().then(load).then(()=>{theme();route()});
</script>
</body></html>
